name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/whatzmcp
    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        id: v
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "package.json version $PKG_VERSION does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
            ${{ env.IMAGE }}:latest

      - name: Publish to npm
        id: npm
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --provenance --access public
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Skip npm
        if: env.NPM_TOKEN == ''
        run: echo "NPM_TOKEN is not set, skipping npm publish. The registry entry will list the container image only."

      - name: Prepare server.json
        env:
          VERSION: ${{ steps.v.outputs.version }}
          NPM_PUBLISHED: ${{ steps.npm.outputs.published }}
        run: |
          jq --arg v "$VERSION" --arg img "$IMAGE:$VERSION" '
            .version = $v
            | .packages |= map(
                if .registryType == "npm" then .version = $v
                elif .registryType == "oci" then .identifier = $img
                else . end)
          ' server.json > server.release.json
          if [ "$NPM_PUBLISHED" != "true" ]; then
            jq '.packages |= map(select(.registryType == "oci"))' server.release.json > server.tmp.json
            mv server.tmp.json server.release.json
          fi
          mv server.release.json server.json
          cat server.json

      - name: Install mcp-publisher
        run: |
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${OS}_${ARCH}.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --version || true

      - name: Publish to the MCP registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
